# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - topic
    properties:
      topic:
        type: string
        description: ntfy topic name to send notifications
      url:
        type: string
        default: https://ntfy.sh
        description: "URL of ntfy server (default: https://ntfy.sh)"
      token:
        type: string
        default: ""
        description: Authentication token for protected topics (only sent to the configured url)
      topicsAllowlist:
        type: string
        default: ""
        description: Comma-separated topics the agent may choose from (plus topic), e.g. alerts,builds
      allowTopicOverride:
        type: boolean
        default: false
        description: Let the agent send to a topic other than the configured one
      allowUrlOverride:
        type: boolean
        default: false
        description: Let the agent send to a server other than the configured url
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({
      command: 'npx',
      args: ['ntfy-me-mcp'],
      env: Object.assign(
        { NTFY_TOPIC: config.topic },
        config.url ? { NTFY_URL: config.url } : {},
        config.token ? { NTFY_TOKEN: config.token } : {},
        config.topicsAllowlist ? { NTFY_TOPICS_ALLOWLIST: config.topicsAllowlist } : {},
        config.allowTopicOverride === true ? { NTFY_ALLOW_TOPIC_OVERRIDE: 'true' } : {},
        config.allowUrlOverride === true ? { NTFY_ALLOW_URL_OVERRIDE: 'true' } : {}
      )
    })
  exampleConfig:
    topic: my-topic
    url: https://ntfy.sh
    token: my-secret-token
